name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v4.1.0, v4.2.0, etc.

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Boost
        run: |
          vcpkg install boost-algorithm boost-filesystem boost-range
          echo "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Configure CMake
        run: |
          cmake -G "Ninja Multi-Config" -B build -DVERSION_INCLUDE_BUILDID=OFF -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake --fresh
        shell: cmd
        env:
          CC: cl
          CXX: cl

      - name: Build Release
        run: cmake --build build --config Release
        shell: cmd

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: which.exe
          generate_release_notes: true
          draft: false
          prerelease: false
