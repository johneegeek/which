name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v4.1.0, v4.2.0, etc.

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Boost
        run: |
          $Url = "https://sourceforge.net/projects/boost/files/boost-binaries/1.84.0/boost_1_84_0-msvc-14.3-64.exe"
          $BoostInstaller = "$env:TEMP\boost-installer.exe"
          Invoke-WebRequest -Uri $Url -OutFile $BoostInstaller
          Start-Process -Wait -FilePath $BoostInstaller -ArgumentList "/SILENT","/SP-","/SUPPRESSMSGBOXES","/DIR=C:\boost"
          echo "BOOST_ROOT=C:\boost" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Configure CMake
        run: |
          cmake -G "Ninja Multi-Config" -B build -DVERSION_INCLUDE_BUILDID=OFF --fresh
        shell: cmd
        env:
          CC: cl
          CXX: cl

      - name: Build Release
        run: cmake --build build --config Release
        shell: cmd

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: which.exe
          generate_release_notes: true
          draft: false
          prerelease: false
